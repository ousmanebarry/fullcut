<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#ffffff" />
		<title>Offline · Fullcut</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: system-ui, sans-serif;
				color: #0a0a0a;
				background: #ffffff;
			}
			main {
				max-width: 24rem;
				padding: 1.5rem;
				text-align: center;
			}
			h1 {
				font-size: 1.5rem;
				margin: 0 0 0.75rem;
			}
			p {
				color: #525252;
				line-height: 1.5;
			}
			a {
				display: inline-block;
				margin-top: 1rem;
				padding: 0.5rem 1rem;
				border-radius: 0.5rem;
				background: #171717;
				color: #ffffff;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>You're offline</h1>
			<p>
				Fullcut needs a connection to show your bookings, so nothing here is out of date. Check your
				signal and try again.
			</p>
			<a href="/dashboard">Try again</a>
		</main>
	</body>
</html>
