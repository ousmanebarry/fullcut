name: CI

on:
  pull_request:
  # Called by deploy.yml so main is re-tested before anything ships.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm --filter web build

      - run: pnpm --filter web check:bundle

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec supabase start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor

      - run: pnpm db:reset

      # pgTAP tests (RLS, constraints) then the booking concurrency test
      - run: pnpm db:test

  e2e:
    runs-on: ubuntu-latest
    env:
      SITE_URL: http://localhost:3000
      # Local-only demo login for tests/e2e/demo.spec.ts; also proves the password stays out of the bundle.
      DEMO_USER_ID: 5e1f0000-0000-4000-8000-000000000001
      DEMO_USER_EMAIL: demo@e2e.example.com
      DEMO_PASSWORD: e2e-demo-password-not-a-secret
      DEMO_SHOP_SLUG: fullcut-demo
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Realtime stays on for the live-calendar test.
      - run: pnpm exec supabase start -x storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor

      - name: Point the app at the local stack
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - run: pnpm --filter web exec playwright install --with-deps chromium

      - run: pnpm --filter web build

      # Built with a real secret key in env, so this also catches the literal value leaking.
      - run: pnpm --filter web check:bundle

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
