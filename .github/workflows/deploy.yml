name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy halfway through a migration; queue the next one instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_CLI: vercel@64.7.0

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  migrate-staging:
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec supabase link --project-ref "${{ secrets.STAGING_PROJECT_REF }}"

      # No --include-seed: seed.sql is local-only fake data.
      - run: pnpm exec supabase db push

  # The `production` environment requires reviewer approval before this job starts.
  production:
    needs: migrate-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec supabase link --project-ref "${{ secrets.PRODUCTION_PROJECT_REF }}"

      # Schema first, so the new app version never runs against an older schema.
      - run: pnpm exec supabase db push

      - run: npm install --global "$VERCEL_CLI"

      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # --prebuilt builds outside Vercel, so system env vars like VERCEL_ENV must be set by hand.
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_ENV: production

      - run: pnpm --filter web check:bundle

      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
