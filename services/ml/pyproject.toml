[project]
name = "fullcut-ml"
version = "0.1.0"
description = "Fullcut no-show risk model: features, training, evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "joblib>=1.4",
  "lightgbm>=4.5",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.9",
  "scikit-learn>=1.5",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=8.3",
    "ruff>=0.8",
]
notebook = ["ipykernel>=6.29", "nbconvert>=7.16"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
