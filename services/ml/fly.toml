# fly.toml app configuration file generated for fullcut on 2026-10-22T01:23:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fullcut'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Kaggle prototype (clinic data), knowingly enabled for the demo; set to 'false' to fall back to the heuristic.
  ML_MODEL_ENABLED = 'true'
  ML_MODEL_PATH = '/app/model/model.joblib'
  ML_MIN_SHOP_HISTORY = '0'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
